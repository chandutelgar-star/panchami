<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Panchami ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050008;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 25px;
      max-width: 600px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      color: #ddd;
    }

    button {
      margin-top: 30px;
      padding: 15px 28px;
      border-radius: 30px;
      border: none;
      background: #ff2f7d;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Panchami ❤️</h1>

    <p>
      I made something special for you...
    </p>

    <button onclick="start()">I promise ✨</button>
  </div>

  <script>
    function start() {
      alert("Okay Panchami... here we go ❤️");
    }
  </script>

</body>
</html>
